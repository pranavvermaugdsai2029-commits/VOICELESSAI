[project]
name = "signdetr-demo"
version = "0.1.0"
description = "Static sign language recognition demo using a transformer-based vision model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "colorama>=0.4.6",
    "einops>=0.8.1",
    "matplotlib>=3.10.5",
    "rich>=13.0.0",
    "torch>=2.8.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
